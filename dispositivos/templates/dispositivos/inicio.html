{% extends "base.html" %}

{% block title %}Inicio | EcoEnergy{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <p class="text-uppercase text-primary fw-semibold mb-2">EcoEnergy</p>
                    <h1 class="display-6 fw-bold mb-3">{{ sistema }}</h1>
                    <p class="lead text-muted mb-4">{{ mensaje }}</p>
                    <div class="d-flex align-items-center">
                        <span class="badge bg-light text-dark border">Curso</span>
                        <p class="mb-0 ms-3">{{ asignatura }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
